<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Rocket</title>
<style>
:root { --ink: #241838; --paper: #fff6e4; --yel: #ffd23f; --cheese: #ffb703; --space: #1b1140; --target: 48px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--space); color: var(--ink); font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }
body { overflow-wrap: break-word; }
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }
header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); color: #fff8e4; }
header h1 { margin: 0; flex: 1 1 auto; font-size: clamp(22px, 3vw, 40px); line-height: 1; text-wrap: balance; }
#tipCount { margin: 0; font-size: clamp(18px, 2vw, 28px); font-weight: 700; }
#planetMap { display: flex; gap: 6px; align-items: center; }
#planetMap i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff8e4; box-sizing: border-box; display: block; }
#ticket { flex: none; margin: 0; padding: 0 16px 6px; color: #fff8e4; }
#ticket p { margin: 0; text-wrap: pretty; }
#question { font-size: clamp(22px, 2.6vw, 36px); font-weight: 700; }
#askTop { font-size: clamp(18px, 2vw, 26px); }
#stage { flex: 1 1 auto; min-height: 120px; position: relative; }
#c { width: 100%; height: 100%; display: block; }
#titleCard { position: absolute; left: 50%; top: 6%; transform: translateX(-50%); width: min(640px, 92%); background: var(--paper); border: 6px solid var(--ink); border-radius: 18px; padding: 18px 20px 12px; text-align: center; box-shadow: 8px 8px 0 #0008; }
#titleCard p { margin: 0 0 8px; font-size: clamp(18px, 2vw, 26px); text-wrap: pretty; }
#titleCard .logo { font-size: clamp(36px, 6vw, 76px); font-weight: 700; line-height: 0.95; text-wrap: balance; }
#dock { flex: none; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
button, input { font: inherit; min-block-size: var(--target); min-inline-size: var(--target); }
button { background: var(--yel); color: var(--ink); border: 4px solid var(--ink); border-radius: 12px; padding: 6px 16px; font-weight: 700; font-size: clamp(18px, 2vw, 28px); cursor: pointer; }
button:active { transform: translateY(2px); }
button[aria-pressed="true"] { background: #9be88f; }
#minusBtn, #plusBtn { font-size: 36px; min-inline-size: 64px; }
#countInput { width: 4.2em; font-size: clamp(22px, 2.4vw, 32px); text-align: center; border: 4px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
label[for="countInput"], .countLab { color: #fff8e4; font-weight: 700; font-size: clamp(16px, 1.6vw, 22px); }
#dock p, #hint { color: #fff8e4; text-align: center; font-size: clamp(18px, 2vw, 28px); text-wrap: pretty; margin: 4px 0; }
#bakeBtn, #playBtn, #continueBtn, #nextBtn { background: #ff7a45; color: #fff8e4; }
dialog { border: 6px solid var(--ink); border-radius: 18px; background: var(--paper); color: var(--ink); padding: 16px 18px 12px; width: min(880px, calc(100vw - 24px)); max-height: min(90dvh, 900px); }
dialog[open] { display: flex; flex-direction: column; gap: 8px; }
dialog:modal { overscroll-behavior: contain; }
dialog::backdrop { overflow: hidden; overscroll-behavior: contain; background: rgba(12, 8, 28, .62); }
dialog h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); text-wrap: balance; }
dialog p { margin: 0; text-wrap: pretty; }
#plList { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#hatGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.hat { text-align: left; }
.hat small { display: block; font-weight: 400; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
#shopMsg:empty, #hint:empty { display: none; }
#hint { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
#sliceRow button { font-size: 15px; min-block-size: 36px; padding: 2px 10px; }
.tic { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -2px; border: 2px solid var(--ink); border-radius: 50%; background: #ffcc4d; }
.tic.pep { background: #e24b3b; }
.tic.mush { background: #f4efe4; border-radius: 40% 40% 46% 46%; }
.tic.olive { background: #3a6b32; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pizza Rocket</h1>
    <p id="tipCount">0 tips</p>
    <div id="planetMap" aria-label="Planets on the map"></div>
    <button type="button" id="musicBtn" aria-pressed="false">Music off</button>
    <button type="button" id="whoBtn">Who am I?</button>
  </header>
  <div id="ticket" hidden>
    <p id="question"></p>
    <p id="askTop"></p>
  </div>
  <div id="stage">
    <canvas id="c" width="800" height="450"></canvas>
    <div id="titleCard">
      <p class="logo">Pizza Rocket</p>
      <p>Read the order. Bake the pizzas. Fly them out.</p>
      <button type="button" id="playBtn">Let's cook</button>
    </div>
  </div>
  <div id="dock">
    <div id="dockKitchen" hidden>
      <div class="row">
        <div class="row" id="countBox">
          <button type="button" id="minusBtn" aria-label="Fewer pizzas">−</button>
          <label class="countLab" for="countInput">Pizzas
            <input id="countInput" inputmode="numeric" value="0">
          </label>
          <button type="button" id="plusBtn" aria-label="More pizzas">+</button>
        </div>
        <button type="button" id="bakeBtn">Bake</button>
        <button type="button" id="shopBtn">Hat Rack</button>
      </div>
      <div class="row" id="topRow">
        <button type="button" id="top-pepperoni" aria-pressed="false"><span class="tic pep" aria-hidden="true"></span>Pepperoni</button>
        <button type="button" id="top-mushroom" aria-pressed="false"><span class="tic mush" aria-hidden="true"></span>Mushroom</button>
        <button type="button" id="top-olive" aria-pressed="false"><span class="tic olive" aria-hidden="true"></span>Olive</button>
        <button type="button" id="top-cheese" aria-pressed="false"><span class="tic" aria-hidden="true"></span>Cheese</button>
      </div>
      <div class="row" id="sliceRow" hidden>
        <button type="button" id="slice0" aria-pressed="false">Slice 1</button>
        <button type="button" id="slice1" aria-pressed="false">Slice 2</button>
        <button type="button" id="slice2" aria-pressed="false">Slice 3</button>
        <button type="button" id="slice3" aria-pressed="false">Slice 4</button>
        <button type="button" id="slice4" aria-pressed="false">Slice 5</button>
        <button type="button" id="slice5" aria-pressed="false">Slice 6</button>
        <button type="button" id="slice6" aria-pressed="false">Slice 7</button>
        <button type="button" id="slice7" aria-pressed="false">Slice 8</button>
      </div>
    </div>
    <div id="dockBaking" hidden><p>The oven's going…</p></div>
    <div id="dockResult" hidden>
      <p id="hint" aria-live="polite"></p>
      <div class="row">
        <button type="button" id="retryBtn" hidden>Try again</button>
        <button type="button" id="continueBtn">Next order</button>
      </div>
    </div>
    <div id="dockFlight" hidden>
      <div class="row">
        <button type="button" id="upBtn">Up</button>
        <button type="button" id="downBtn">Down</button>
        <p id="flightLabel">Hold on to the pizzas!</p>
      </div>
    </div>
    <div id="dockDelivery" hidden>
      <p id="delText"></p>
      <p id="delTips"></p>
      <div class="row"><button type="button" id="nextBtn">Back to the kitchen</button></div>
    </div>
  </div>
</div>

<dialog id="whoDlg" aria-labelledby="whoTitle">
  <h1 id="whoTitle">Who am I?</h1>
  <div id="plList"></div>
  <form id="plForm">
    <div class="row">
      <label for="plName">Name</label>
      <input id="plName" autocomplete="nickname" maxlength="16" autofocus>
      <button type="submit" id="plDone">This is me</button>
    </div>
  </form>
  <div class="row">
    <button type="button" id="plAdd" hidden>Add a player</button>
    <form method="dialog"><button type="submit" id="whoClose" value="close">Close</button></form>
  </div>
</dialog>

<dialog id="shopDlg" aria-labelledby="shopTitle">
  <h1 id="shopTitle">Hat Rack</h1>
  <p>You have <b id="shopTips">0</b> tips.</p>
  <div id="hatGrid"></div>
  <p id="shopMsg" aria-live="polite"></p>
  <form method="dialog"><button type="submit" id="shopBack" value="back">Back to the kitchen</button></form>
</dialog>

<script>
'use strict';
const QS = new URLSearchParams(location.search);
const DEBUG = QS.has('debug') || QS.has('test');
const TEST = QS.has('test');
const SHOT = QS.get('test') || '';
const NS = TEST ? 'pizzarocket.test' : 'pizzarocket';

const ALIENS = [
  { id: 'zorp', name: 'Zorp', body: '#3dba4a', eye: 3 },
  { id: 'glimmy', name: 'Glimmy', body: '#c06bff', eye: 2 },
  { id: 'bonk', name: 'Bonk', body: '#9a9088', eye: 2 },
  { id: 'fuzzles', name: 'The Fuzzles', body: '#ff8ad4', eye: 8 },
];
const TOPPINGS = [
  { id: 'pepperoni', name: 'pepperoni' },
  { id: 'mushroom', name: 'mushroom' },
  { id: 'olive', name: 'olive' },
  { id: 'cheese', name: 'cheese' },
];
const HATS = [
  { id: 'star-goggles', name: 'Star goggles', cost: 15, who: 'biscuit' },
  { id: 'tall-hat', name: 'Taller hat', cost: 20, who: 'waffles' },
  { id: 'bow', name: 'Bow tie', cost: 12, who: 'crumbs' },
  { id: 'gold-wrench', name: 'Gold wrench', cost: 18, who: 'sprocket' },
  { id: 'cape', name: 'Pizza cape', cost: 25, who: 'biscuit' },
  { id: 'moon-boots', name: 'Moon boots', cost: 22, who: 'sprocket' },
  { id: 'antenna', name: 'Antenna sticker', cost: 16, who: 'waffles' },
  { id: 'crown', name: 'Crumb crown', cost: 30, who: 'crumbs' },
];
const PLAN = [
  { skill: 'picture-graph-key', key: 1, q: 'count', cats: 2, half: false },
  { skill: 'picture-graph-key', key: 2, q: 'count', cats: 2, half: false },
  { skill: 'picture-graph-key', key: 2, q: 'count', cats: 3, half: false },
  { skill: 'picture-graph-key', key: 4, q: 'more', cats: 3, half: false },
  { skill: 'picture-graph-key', key: 5, q: 'total', cats: 3, half: false },
  { skill: 'picture-graph-key', key: 4, q: 'count', cats: 3, half: true },
  { skill: 'picture-graph-key', key: 10, q: 'more', cats: 4, half: true },
  { skill: 'scaled-bar-graph', scale: 2, q: 'count', cats: 3, between: false },
  { skill: 'scaled-bar-graph', scale: 5, q: 'more', cats: 3, between: true },
  { skill: 'scaled-bar-graph', scale: 10, q: 'total', cats: 4, between: true },
  { skill: 'fraction-slices', q: 'fraction', cats: 1 },
];

const $ = id => document.getElementById(id);
const cv = $('c');
const ctx = cv.getContext('2d');
let W = 800, H = 450, anim = 0;
let screen = 'title';
let screenBeforeWho = 'title';
let order = null;
let count = 0;
let topping = null;
let slices = [0, 0, 0, 0, 0, 0, 0, 0];
let attempt = 0;
let result = null;
let pendingFlight = false;
let flight = null;
let held = { up: false, down: false };
let modeT = 0;
const BAKE_MS = TEST ? 500 : 900;
let P = { list: [], cur: null };
let S = blankSave(1);
let musicOn = false;
let musicStop = null;
let audioCtx = null;

function blankSave(seed) {
  return { v: 1, tips: 0, hats: [], equipped: {}, deliveries: 0, shift: 0, goodSince: 0, flightLeg: 0, flights: 0, unlocked: 1, seed };
}
function lsGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch { /* private mode */ }
}
function loadPlayers() {
  try {
    const raw = lsGet(NS + '.players');
    if (!raw) return { list: [], cur: null };
    const p = JSON.parse(raw);
    if (!p || !Array.isArray(p.list)) return { list: [], cur: null };
    return p;
  } catch { return { list: [], cur: null }; }
}
function savePlayers() { lsSet(NS + '.players', JSON.stringify(P)); }
function loadSave() {
  const cur = P.list.find(p => p.id === P.cur);
  if (!cur) { S = blankSave(1); return; }
  try {
    const raw = lsGet(NS + '.v1.' + cur.id);
    S = raw ? { ...blankSave(cur.n || 1), ...JSON.parse(raw) } : blankSave(cur.n || 1);
  } catch { S = blankSave(1); }
  if (!S.equipped) S.equipped = {};
  if (!Array.isArray(S.hats)) S.hats = [];
  S.unlocked = Math.min(4, Math.max(1, S.unlocked || 1));
}
function save() {
  if (!P.cur) return;
  lsSet(NS + '.v1.' + P.cur, JSON.stringify(S));
  paintChrome();
}

function rngOf(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pictureRow(key, halfOk, rng, maxValue) {
  const opts = [];
  const halfUnit = key / 2;
  for (let s = 0; s <= 4; s++) {
    const v = s * key;
    if (v >= 1 && v <= maxValue) opts.push({ symbols: s, half: false, value: v });
    if (halfOk && key % 2 === 0) {
      const hv = s * key + halfUnit;
      if (hv >= 1 && hv <= maxValue) opts.push({ symbols: s, half: true, value: hv });
    }
  }
  if (!opts.length) return { symbols: 1, half: false, value: key };
  return opts[Math.floor(rng() * opts.length)];
}
function barRow(use, rng, maxValue) {
  const scale = use.scale;
  const opts = [];
  for (let v = 1; v <= maxValue; v++) {
    const onLine = v % scale === 0;
    if (use.between && onLine) continue;
    if (!use.between && !onLine) continue;
    opts.push(v);
  }
  if (!opts.length) {
    for (let v = 1; v <= maxValue; v++) opts.push(v);
  }
  return { symbols: 0, half: false, value: opts[Math.floor(rng() * opts.length)] };
}
function buildOrder(opts = {}) {
  const shift = opts.shift ?? S.shift;
  const unlocked = opts.unlocked ?? S.unlocked;
  const seed = opts.seed ?? S.seed;
  let spec = PLAN[shift % PLAN.length];
  if (opts.kind === 'fraction') spec = { skill: 'fraction-slices', q: 'fraction', cats: 1 };
  if (opts.kind === 'bar') spec = { skill: 'scaled-bar-graph', scale: 5, q: 'count', cats: 3, between: true };
  if (opts.kind === 'picture') spec = PLAN[1];
  const rng = rngOf((seed * 997 + shift * 131 + (opts.kind === 'bar' ? 17 : 0) + (opts.kind === 'fraction' ? 29 : 0)) >>> 0);
  if (spec.skill === 'fraction-slices') {
    const pep = 1 + Math.floor(rng() * 6);
    return {
      skill: 'fraction-slices', q: 'fraction', debug: !!opts.debug, rows: [],
      ask: ALIENS[0].id, askB: null, answer: 1, topping: null, pepperoni: pep,
      dest: ALIENS[0].id, key: null, scale: null, half: false,
      question: `${ALIENS[0].name} wants ${pep}/8 pepperoni. The rest is cheese.`,
      toppingAsk: '',
    };
  }
  const cats = ALIENS.slice(0, spec.cats);
  let q = spec.q;
  if ((q === 'more' || q === 'total') && cats.length < 2) q = 'count';
  const rows = [];
  if (spec.skill === 'picture-graph-key' && q === 'total') {
    for (const c of cats) rows.push({ id: c.id, name: c.name, symbols: 1, half: false, value: spec.key });
  } else {
    let budget = 12;
    for (let i = 0; i < cats.length; i++) {
      const later = cats.length - i - 1;
      const maxV = q === 'total' ? Math.max(1, Math.min(12, budget - later)) : 12;
      const made = spec.skill === 'picture-graph-key'
        ? pictureRow(spec.key, !!spec.half, rng, maxV)
        : barRow(spec, rng, maxV);
      rows.push({ id: cats[i].id, name: cats[i].name, ...made });
      if (q === 'total') budget -= made.value;
    }
  }
  if (q === 'more' && rows.length >= 2 && rows[0].value === rows[1].value) {
    if (spec.skill === 'picture-graph-key') {
      const row = rows[1];
      if (spec.half && spec.key % 2 === 0 && !row.half) {
        rows[1] = { ...row, half: true, value: row.symbols * spec.key + spec.key / 2 };
      } else if ((row.symbols + 1) * spec.key <= 20) {
        rows[1] = { ...row, symbols: row.symbols + 1, half: false, value: (row.symbols + 1) * spec.key };
      } else {
        rows[1] = { ...row, symbols: Math.max(1, row.symbols - 1), half: false, value: Math.max(1, row.symbols - 1) * spec.key };
      }
    } else {
      let v = rows[1].value >= 12 ? rows[1].value - 1 : rows[1].value + 1;
      if (spec.between && v % spec.scale === 0) v += rows[1].value >= 12 ? -1 : 1;
      v = Math.max(1, Math.min(12, v));
      if (spec.between && v % spec.scale === 0) v = Math.max(1, v - 1);
      rows[1] = { ...rows[1], value: v };
    }
  }
  const top = TOPPINGS[Math.floor(rng() * TOPPINGS.length)];
  let ask = rows[0].id, askB = null, answer = rows[0].value, dest = ALIENS[0].id, question = '';
  if (q === 'count') {
    const pool = rows.filter(r => ALIENS.findIndex(a => a.id === r.id) < unlocked);
    const pick = pool[0] || rows[0];
    ask = pick.id; answer = pick.value;
    question = `How many for ${pick.name}?`;
    dest = ALIENS.findIndex(a => a.id === pick.id) < unlocked ? pick.id : ALIENS[0].id;
  } else if (q === 'more') {
    const a = rows[0], b = rows[1];
    const hi = a.value >= b.value ? a : b;
    const lo = hi === a ? b : a;
    ask = hi.id; askB = lo.id; answer = hi.value - lo.value;
    const verb = hi.name === 'The Fuzzles' ? 'do The Fuzzles want' : 'does ' + hi.name + ' want';
    question = 'How many more ' + verb + ' than ' + lo.name + '?';
    dest = ALIENS.findIndex(x => x.id === hi.id) < unlocked ? hi.id : ALIENS[0].id;
  } else {
    answer = rows.reduce((s, r) => s + r.value, 0);
    question = 'How many in all?';
    dest = ALIENS[0].id;
  }
  return {
    skill: spec.skill, q, debug: !!opts.debug, rows, ask, askB, answer,
    topping: top.id, pepperoni: 0, dest, key: spec.key || null, scale: spec.scale || null,
    half: !!spec.half, between: !!spec.between,
    question, toppingAsk: `Topping: ${top.name}`,
  };
}
function auditOrders() {
  const problems = [];
  for (let shift = 0; shift < PLAN.length; shift++) {
    for (const unlocked of [1, 2, 3, 4]) {
      const o = buildOrder({ shift, unlocked, seed: 3 + shift });
      if (o.skill === 'fraction-slices') {
        if (o.answer !== 1 || o.pepperoni < 1 || o.pepperoni > 7) problems.push('fraction ' + shift);
      } else {
        if (o.answer < 1 || o.answer > 24) problems.push('answer ' + o.answer + ' @' + shift);
        if (o.q === 'count') {
          const row = o.rows.find(r => r.id === o.ask);
          if (!row || row.value !== o.answer) problems.push('count ' + shift);
        } else if (o.q === 'more') {
          const a = o.rows.find(r => r.id === o.ask);
          const b = o.rows.find(r => r.id === o.askB);
          if (!a || !b || a.value - b.value !== o.answer || o.answer < 1) problems.push('more ' + shift);
        } else if (o.rows.reduce((s, r) => s + r.value, 0) !== o.answer) problems.push('total ' + shift);
        if (o.skill === 'picture-graph-key') {
          for (const r of o.rows) {
            const v = r.symbols * o.key + (r.half ? o.key / 2 : 0);
            if (v !== r.value) problems.push('symbols ' + shift + ' ' + r.name);
          }
        }
      }
      if (/math|worksheet|curriculum|picture-graph|scaled-bar/i.test(o.question + o.toppingAsk)) problems.push('leak ' + o.question);
    }
  }
  return problems;
}

function paintChrome() {
  const tipsShown = screen === 'delivery' ? Math.floor(shownTips) : S.tips;
  $('tipCount').textContent = tipsShown + (tipsShown === 1 ? ' tip' : ' tips');
  const map = $('planetMap');
  if (!map.childElementCount) {
    for (let i = 0; i < 4; i++) map.appendChild(document.createElement('i'));
  }
  [...map.children].forEach((dot, i) => {
    dot.style.background = i < S.unlocked ? ALIENS[i].body : 'transparent';
  });
  $('shopTips').textContent = String(S.tips);
  $('countInput').value = String(count);
  for (const t of TOPPINGS) {
    const b = $('top-' + t.id);
    b.setAttribute('aria-pressed', topping === t.id ? 'true' : 'false');
  }
  const frac = order && order.skill === 'fraction-slices';
  $('topRow').hidden = !!frac;
  $('countBox').hidden = !!frac;
  $('sliceRow').hidden = !frac;
  for (let i = 0; i < 8; i++) {
    const b = $('slice' + i);
    b.setAttribute('aria-pressed', slices[i] ? 'true' : 'false');
    b.textContent = slices[i] ? 'Slice ' + (i + 1) + ' pepperoni' : 'Slice ' + (i + 1);
  }
  if (order && (screen === 'kitchen' || screen === 'baking' || screen === 'result')) {
    $('question').textContent = order.question;
    $('askTop').textContent = order.toppingAsk;
    $('ticket').hidden = false;
  } else $('ticket').hidden = true;
  $('titleCard').hidden = screen !== 'title';
  $('dockKitchen').hidden = screen !== 'kitchen';
  $('dockBaking').hidden = screen !== 'baking';
  $('dockResult').hidden = screen !== 'result';
  $('dockFlight').hidden = screen !== 'flight';

  const maxV = Math.max(order.scale * 2, ...order.rows.map(r => r.value), order.scale);
  const nice = Math.ceil(maxV / order.scale) * order.scale;
  ctx.save();
  ctx.translate(x + 22, (top + bottom) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.font = '700 16px Trebuchet MS, sans-serif';
  ctx.fillStyle = '#6b3a16';
  ctx.fillText('pizzas', 0, 0);
  ctx.restore();
  ctx.font = '700 13px Trebuchet MS, sans-serif';
  ctx.textAlign = 'right';
  const span = bottom - top;
  for (let v = 0; v <= nice; v++) {
    const yy = bottom - (v / nice) * span;
    const major = v % order.scale === 0;
    ctx.strokeStyle = major ? '#8d6244' : '#eadcc4';
    ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(left + gw, yy); ctx.stroke();
    if (major) {
      ctx.fillStyle = '#6b3a16';
      ctx.fillText(String(v), left - 8, yy + 4);
    }
  }
  const bw = Math.min(72, gw / (order.rows.length * 2));
  order.rows.forEach((r, i) => {
    const bx = left + gw * (i + 0.5) / order.rows.length - bw / 2;
    const bh = (r.value / nice) * span;
    ctx.fillStyle = ALIENS.find(a => a.id === r.id).body;
    rr(bx, bottom - bh, bw, Math.max(bh, 2), 6); ctx.fill();
    ctx.strokeStyle = '#241838'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#241838'; ctx.textAlign = 'center';
    ctx.font = '700 16px Trebuchet MS, sans-serif';
    ctx.fillText(r.name, bx + bw / 2, bottom + 20);
  });
  ctx.textAlign = 'left';
}
function drawStack(x, y) {
  stackAt = { x, y };
  const n = Math.min(count, 6);
  for (let i = 0; i < n; i++) drawPizza(x, y - i * 9, 22, { topping: topping || 'cheese' });
  if (count > 6) {
    ctx.fillStyle = '#241838'; ctx.font = '700 16px Trebuchet MS, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+' + (count - 6), x, y - n * 9 - 16);
  }
}
function drawCrumbsEat(x, y) {
  const sway = Math.sin(anim / 140) * 0.18;
  ctx.save();
  ctx.translate(x + 8, y + 6);
  ctx.rotate(sway);
  ctx.fillStyle = '#b9b6bd';
  ctx.beginPath(); ctx.ellipse(22, 2, 14, 7, 0.3, 0, 7); ctx.fill();
  drawCat(0, 0, 'crumbs', 1.55, (S.equipped || {}).crumbs);
  drawPizza(34, -118, 18, { topping: topping || 'cheese' });
  ctx.restore();
  for (let i = 0; i < 12; i++) {
    const a = anim / 240 + i * 0.65;
    const px = x + Math.cos(a) * (18 + (i % 4) * 18);
    const py = y - 80 + Math.sin(a * 1.3) * (10 + (i % 5) * 9);
    ctx.fillStyle = i % 2 ? '#e6b15c' : '#fff1c9';
    ctx.beginPath(); ctx.arc(px, py, 2.5 + (i % 3), 0, 7); ctx.fill();
  }
}
function drawCrew(baseline) {
  const hats = S.equipped || {};
  const crew = [['biscuit', 'Biscuit', 1], ['waffles', 'Waffles', 1], ['crumbs', 'Crumbs', 1.02], ['sprocket', 'Sprocket', 0.9]];
  const sc = Math.min(1.38, Math.max(0.72, H / 600));
  const gap = Math.min(240, Math.max(108, (W - 80) / 3));
  const x0 = (W - gap * 3) / 2;
  const eating = screen === 'result' && result && result.kind === 'crumbs';
  crew.forEach(([kind, name, mul], i) => {
    if (eating && kind === 'crumbs') return;
    const x = x0 + gap * i;
    const hop = screen === 'result' && result && result.kind === 'ok' && kind === 'sprocket'
      ? Math.abs(Math.sin(anim / 140)) * 20 : 0;
    drawCat(x, baseline - hop, kind, sc * mul, hats[kind]);
    if (kind === 'waffles') waffleAt = { x, y: baseline - hop };
    ctx.font = '700 12px Trebuchet MS, sans-serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(name).width;
    const py = baseline + 2;
    ctx.fillStyle = '#120c28';
    rr(x - tw / 2 - 7, py - 12, tw + 14, 16, 6); ctx.fill();
    ctx.fillStyle = '#fff8e4';
    ctx.fillText(name, x, py);
  });
}
function drawKitchen() {
  drawStation();
  const crewScale = Math.min(1.38, Math.max(0.72, H / 600));
  const baseline = H - 16;
  const boardY = 28;
  const boardH = Math.max(160, baseline - Math.round(168 * crewScale + 24) - boardY);
  const boardW = Math.max(240, W - 310);
  drawBoard(16, boardY, boardW, boardH);
  const panelX = boardW + 36;
  const panelW = Math.max(80, W - panelX - 16);
  const who = (order && (order.dest || order.ask)) || 'zorp';
  const ovenH = 100;
  const ovenY = boardY + boardH - ovenH;
  const winTop = boardY + 6;
  const winH = Math.max(72, ovenY - winTop - 12);
  ctx.save();
  rr(panelX, winTop, panelW, winH, 16); ctx.clip();
  ctx.fillStyle = '#100c24';
  ctx.fillRect(panelX, winTop, panelW, winH);
  ctx.fillStyle = '#fff8e4';
  for (let i = 0; i < 14; i++) ctx.fillRect(panelX + 12 + (i * 41) % Math.max(8, panelW - 20), winTop + 10 + (i * 29) % Math.max(8, winH - 16), 2, 2);
  ctx.restore();
  ctx.strokeStyle = '#c5ceda'; ctx.lineWidth = 8;
  rr(panelX, winTop, panelW, winH, 16); ctx.stroke();
  const ascale = Math.min(1.65, panelW / 140, (winH * 0.7) / 100);
  drawAlien(who, panelX + panelW / 2, winTop + winH * 0.8, customerMood(), Math.max(0.7, ascale));
  drawOven(panelX + Math.max(0, panelW / 2 - 62), ovenY, screen === 'baking');
  const stackX = boardW - 150;
  const stackY = boardY + Math.min(boardH - 80, boardH * 0.7);
  if (order && order.skill !== 'fraction-slices' && count > 0) drawStack(stackX, stackY);
  else stackAt = { x: stackX, y: stackY };
  drawCrew(baseline);
  if (screen === 'result' && result && result.kind === 'crumbs') drawCrumbsEat(stackAt.x, stackAt.y + 4);
  if (screen === 'result') {
    const hint = $('hint').textContent;
    if (hint) bubble(waffleAt.x, waffleAt.y - 150, hint);
  } else if (screen === 'kitchen' && order && order.skill !== 'fraction-slices' && topping && topping !== order.topping) {
    bubble(waffleAt.x, waffleAt.y - 150, 'The ticket says ' + order.topping + '.');
  }
}
function drawFlightScene() {
  drawStars();
  if (!flight) return;
  const p = Math.min(1, flight.t / flight.dur);
  const rad = Math.min(H * 0.2, 108) * (1 + p * 0.85);
  drawPlanet(flight.dest, W - rad - 36, H * 0.46, rad);
  for (const rk of flight.rocks) {
    if (rk.x < -0.2 || rk.x > 1.4) continue;
    drawRock(rk.x * W, rk.lane * H, rk.r, anim / 500 + rk.x * 3);
  }
  const across = (start, speed) => {
    const u = start - flight.t * speed;
    return ((u % 1.15) + 1.15) % 1.15 * W;
  };
  drawSock(across(0.78, 0.16), H * 0.2);
  drawSat(across(0.42, 0.09), H * 0.76);
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(28 + i * 42, 26);
    ctx.globalAlpha = i < flight.hits ? 0.35 : 1;
    if (i < flight.hits) ctx.rotate(0.5);
    ctx.fillStyle = '#f3e2c2';
    rr(-16, -12, 32, 22, 3); ctx.fill();
    ctx.strokeStyle = '#6b3a16'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, -1); ctx.lineTo(16, -1); ctx.stroke();
    ctx.restore();
  }
  const wob = flight.wobble > 0 ? Math.sin(anim / 40) * 0.12 : 0;
  drawRocket(0.2 * W, flight.y * H, 1.35, {
    flame: true, dropped: flight.dropped, wobble: flight.wobble > 0,
    hat: (S.equipped || {}).biscuit, tilt: wob,
  });
}
function drawDeliveryScene() {
  drawStars();
  const id = lastDest || 'zorp';
  const R = Math.min(W, H) * 0.3;
  const px = W * 0.66, py = H * 0.58;
  drawPlanet(id, px, py, R);
  const hop = Math.abs(Math.sin(anim / 160)) * 26;
  drawAlien(id, px, py - R + 20 - hop, 'dance', Math.min(1.55, R / 95));
  ctx.fillStyle = '#0006';
  ctx.beginPath(); ctx.ellipse(W * 0.22, py + R * 0.35, 70, 12, 0, 0, 7); ctx.fill();
  drawRocket(W * 0.22, py + R * 0.22, Math.min(1.25, H / 480), {
    flame: false, dropped: false, hat: (S.equipped || {}).biscuit, tilt: 0.18,
  });
}
function drawTitle() {
  drawStars();
  const rs = Math.min(2.45, H / 260, W / 500);
  drawRocket(W * 0.2, H * 0.52, rs, { flame: true, dropped: false, hat: null });
  const sc = Math.min(1.85, H / 380, W / 860);
  const gap = Math.min(210, W * 0.16);
  const x0 = W * 0.46;
  const base = H - 20;
  [['biscuit', 1], ['waffles', 0.96], ['crumbs', 1.02], ['sprocket', 0.88]].forEach(([kind, mul], i) => {
    drawCat(x0 + gap * i, base, kind, sc * mul, null);
  });
}
function draw() {
  resize();
  if (screen === 'title' || screen === 'who' && screenBeforeWho === 'title') drawTitle();
  else if (screen === 'flight') drawFlightScene();
  else if (screen === 'delivery') drawDeliveryScene();
  else drawKitchen();
}

let pumping = false;
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  if (!pumping) tick(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function visibleButtons() {
  return [...document.querySelectorAll('button')].filter(el => {
    if (el.hidden || el.closest('[hidden]')) return false;
    const dlg = el.closest('dialog');
    if (dlg && !dlg.open) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }).map(el => el.id);
}
if (DEBUG) {
  window.__pizza = {
    get screen() { return screen; },
    get order() { return order; },
    get count() { return count; },
    get topping() { return topping; },
    get slices() { return pepCount(); },
    get pie() { return pie; },
    get tips() { return S.tips; },
    get flight() { return flight; },
    get save() { return S; },
    get result() { return result; },
    PLAN, HATS, ALIENS,
    buttons: visibleButtons,
    audit: auditOrders,
    hold(dir) { held.up = dir === 'up'; held.down = dir === 'down'; },
    pump(ms) {
      pumping = true;
      const steps = Math.ceil(ms / 16);
      for (let i = 0; i < steps; i++) tick(16);
      pumping = false;
      draw();
    },
    debugOrder(kind) {
      order = buildOrder({ kind, debug: true, shift: S.shift });
      count = order.skill === 'fraction-slices' ? 1 : 0;
      topping = null; slices = [0, 0, 0, 0, 0, 0, 0, 0]; attempt = 0;
      show('kitchen');
    },
  };
}

function applyShot() {
  if (!SHOT) return;
  if (SHOT !== 'title' && SHOT !== 'who' && !P.cur) {
    P = { list: [{ id: 'p1', name: 'Tester', n: 1 }], cur: 'p1' };
    savePlayers(); S = blankSave(1); save();
  }
  if (SHOT === 'title') show('title');
  else if (SHOT === 'who') openWho();
  else if (SHOT === 'kitchen' || SHOT === 'crumbs' || SHOT === 'fraction' || SHOT === 'bar') {
    if (SHOT === 'fraction') order = buildOrder({ kind: 'fraction', debug: true });
    else if (SHOT === 'bar') order = buildOrder({ kind: 'bar', debug: true });
    else order = buildOrder();
    count = order && order.skill === 'fraction-slices' ? 1 : 0;
    topping = null; slices = [0, 0, 0, 0, 0, 0, 0, 0]; attempt = 0;
    show('kitchen');
    if (SHOT === 'crumbs') { count = order.answer + 2; topping = order.topping; bake(); finishBake(); }
  }
  else if (SHOT === 'flight') { lastDest = 'zorp'; beginFlight(); }
  else if (SHOT === 'delivery') { lastDest = 'glimmy'; $('delText').textContent = 'Glimmy takes the box and does a happy dance.'; $('delTips').textContent = 'Tips so far: ' + S.tips; show('delivery'); }
  else if (SHOT === 'shop') { order = buildOrder(); startKitchen(); openShop(); }
}
P = loadPlayers();
loadSave();
applyShot();
paintChrome();
</script>
